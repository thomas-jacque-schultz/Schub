name: release

# Release manuelle, déclenchée à la demande.
# Fait, dans l'ordre :
#   1. sur chaque sous-repo : aligne main sur develop, tag vX.Y.Z, push
#   2. attend que le build docker (déjà existant dans chaque sous-repo) se termine
#   3. aligne les gitlinks de ce repo parent sur les commits tagués, tag le parent
#   4. publie une release GitHub agrégée sur ce repo
#
# Nécessite un secret RELEASE_PAT : PAT (fine-grained recommandé) avec accès
# contents:write sur Schub et les sept sous-repos (schub-back-bff,
# schub-connector-discord, schub-front-servers, schub-core,
# schub-connector-{portainer,freebox,riot}). Le GITHUB_TOKEN par défaut ne peut pas pousser sur
# un autre repo que celui qui exécute le workflow.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à releaser, ex: v1.2.3"
        required: true
      allow_main_rewrite:
        description: "Réaligner main même s'il porte des commits absents de develop (vérifier d'abord ce qu'ils contiennent)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version }}
  ALLOW_MAIN_REWRITE: ${{ inputs.allow_main_rewrite }}
  GH_TOKEN: ${{ secrets.RELEASE_PAT }}
  SUBREPOS: schub-back-bff schub-connector-discord schub-front-servers schub-connector-freebox schub-connector-portainer schub-connector-riot schub-core

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifie le format de version
        run: |
          if ! [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: version doit être de la forme vX.Y.Z (reçu: ${VERSION})"
            exit 1
          fi

      - name: Checkout Schub
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PAT }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global user.name "release-bot"
          git config --global user.email "release-bot@users.noreply.github.com"

      - name: Release chaque sous-repo (aligne main sur develop + tag)
        run: |
          set -e
          for repo in ${SUBREPOS}; do
            echo "== ${repo} =="
            git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/thomas-jacque-schultz/${repo}.git" "/tmp/${repo}"
            cd "/tmp/${repo}"

            # `main` est le POINTEUR de l'état publié ; `develop` est la source de vérité.
            # Sa protection impose un historique linéaire (allowed_merge_methods: rebase), donc
            # un back-merge de main vers develop est impossible : on aligne main sur develop.
            #
            # L'ancienne version faisait un `merge --ff-only`, qui mourait sur un « Not possible
            # to fast-forward » illisible dès qu'un correctif avait été posé directement sur main
            # sans être reporté sur develop. C'est arrivé le 17-09, sur deux des sept sous-repos.
            #
            # Rien n'est perdu pour autant : chaque état publié reste atteignable par son tag.
            extra="$(git log --oneline origin/develop..origin/main || true)"
            if [ -n "${extra}" ]; then
              echo "main porte des commits absents de develop :"
              echo "${extra}"
              if [ "${ALLOW_MAIN_REWRITE}" != "true" ]; then
                echo "Error: leur contenu serait perdu en alignant main sur develop."
                echo "       Vérifier ce qu'ils portent, puis soit reporter ce contenu sur"
                echo "       develop, soit relancer avec allow_main_rewrite=true."
                exit 1
              fi
              echo "allow_main_rewrite=true : main est réaligné malgré tout."
            fi

            git checkout -q -B main origin/develop
            git push --force-with-lease origin main

            # Idempotent : si le tag existe déjà ET pointe sur le commit qu'on release, on
            # continue. C'est le cas quand une release a échoué plus loin (attente du build,
            # gitlinks) et qu'on la relance. Refuser serait bloquer une reprise légitime.
            # S'il pointe ailleurs, en revanche, on s'arrête : deux contenus sous un même nom.
            if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
              if [ "$(git rev-parse "refs/tags/${VERSION}^{commit}")" != "$(git rev-parse HEAD)" ]; then
                echo "Error: ${VERSION} existe déjà sur ${repo} et pointe sur un AUTRE commit"
                exit 1
              fi
              echo "${VERSION} existe déjà et pointe au bon endroit, on continue"
            else
              git tag -a "${VERSION}" -m "release ${VERSION}"
              git push origin "${VERSION}"
            fi

            git rev-parse HEAD > "/tmp/${repo}.sha"
            cd - >/dev/null
          done

      - name: Attend le build docker de chaque sous-repo
        run: |
          set -e
          for repo in ${SUBREPOS}; do
            sha="$(cat "/tmp/${repo}.sha")"
            echo "== attente du build sur ${repo} (${sha:0:7}) =="

            # nommément "release - docker image" : deux workflows se déclenchent sur le
            # même tag (docker + github release), un filtre large sur "release" attrape
            # le premier des deux trouvé, qui peut être le mauvais (celui qui ne construit
            # rien et réussit toujours vite) et donner un faux feu vert.
            run_id=""
            for _ in $(seq 1 30); do
              run_id=$(gh api "repos/thomas-jacque-schultz/${repo}/actions/runs?head_sha=${sha}" \
                --jq '.workflow_runs[] | select(.name == "release - docker image") | .id' | head -1)
              [ -n "$run_id" ] && break
              sleep 5
            done

            if [ -z "$run_id" ]; then
              echo "Error: aucun run de release trouvé pour ${repo}"
              exit 1
            fi

            gh run watch "$run_id" --repo "thomas-jacque-schultz/${repo}" --exit-status
          done

      - name: Aligne les gitlinks de Schub sur les nouveaux tags
        run: |
          set -e
          for repo in ${SUBREPOS}; do
            sha="$(cat "/tmp/${repo}.sha")"
            git update-index --cacheinfo 160000,"${sha}","${repo}"
          done

          # « nothing to commit » est un cas NORMAL, pas une panne : les gitlinks peuvent déjà
          # pointer sur les commits qu'on release, par exemple s'ils ont été réalignés à la main
          # après la fusion des PR. C'est ce qui a fait échouer la release du 17-09, alors que
          # les sept sous-repos étaient déjà tagués et leurs images publiées.
          if git diff --cached --quiet; then
            echo "Les gitlinks pointent déjà sur les commits releasés, rien à committer."
          else
            git commit -m "release: ${VERSION}"
          fi

          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "${VERSION} existe déjà sur Schub, on ne le recrée pas"
          else
            git tag -a "${VERSION}" -m "release ${VERSION}"
          fi
          git push origin main "${VERSION}"

      - name: Publie la release GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          notes="## ${VERSION}"$'\n\n'
          for repo in ${SUBREPOS}; do
            sha="$(cat "/tmp/${repo}.sha")"
            notes+="- ${repo}: ${sha:0:7}"$'\n'
          done
          # Idempotent comme les étapes précédentes : une release relancée met à jour la note
          # au lieu d'échouer sur « release already exists ».
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release edit "${VERSION}" --title "${VERSION}" --notes "${notes}"
          else
            gh release create "${VERSION}" --title "${VERSION}" --notes "${notes}"
          fi
