version: '3'

vars:
  SUBREPOS: schub-back-bff schub-back-bot-server schub-front-servers

tasks:
  submodules:status:
    desc: "État des 3 submodules (branche, avance/retard sur origin, modifs locales)"
    cmds:
      - |
        for repo in {{.SUBREPOS}}; do
          echo "== $repo =="
          git -C "$repo" fetch origin --quiet
          git -C "$repo" status --short --branch
        done

  release:cleanup:
    desc: "Supprime un tag raté sur les 3 sous-repos ET sur Schub. Usage: task release:cleanup VERSION=v1.2.0"
    requires:
      vars: [VERSION]
    cmds:
      - |
        for repo in {{.SUBREPOS}} .; do
          echo "== $repo =="
          git -C "$repo" push origin --delete {{.VERSION}} 2>&1 || true
          git -C "$repo" tag -d {{.VERSION}} 2>&1 || true
        done

  tags:list:
    desc: "Liste les tags de release de Schub (pas des sous-repos)"
    cmd: git tag -l --sort=-v:refname
